{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-2">Create an Escrow Campaign</h1>

                <p class="text-muted mb-4">
                    Creating a campaign automatically creates Block #0,
                    the Genesis Block.
                </p>

                <form method="post">
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label
                                class="form-label"
                                for="{{ field.id_for_label }}"
                            >
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% for error in field.errors %}
                                <div class="text-danger small mt-1">
                                    {{ error }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <button class="btn btn-primary" type="submit">
                        Create Campaign and Genesis Block
                    </button>

                    <a class="btn btn-outline-secondary" href="{% url 'home' %}">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
