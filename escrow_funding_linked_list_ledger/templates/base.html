<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Escrow Funding Ledger</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            Escrow Ledger
        </a>

        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <span class="text-white small d-none d-md-inline">
                    {{ user.username }} · Wallet: ${{ user.profile.balance }}
                </span>

                <a
                    class="btn btn-light btn-sm"
                    href="{% url 'create_project' %}"
                >
                    New Campaign
                </a>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm" type="submit">
                        Log out
                    </button>
                </form>
            {% else %}
                <a
                    class="btn btn-outline-light btn-sm"
                    href="{% url 'login' %}"
                >
                    Log in
                </a>

                <a
                    class="btn btn-light btn-sm"
                    href="{% url 'register' %}"
                >
                    Register
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-4">
    {% for message in messages %}
        <div
            class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show"
            role="alert"
        >
            {{ message }}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
            ></button>
        </div>
    {% endfor %}

    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
